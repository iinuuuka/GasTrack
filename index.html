<style>
  :root {
    --paper: #ffffff;
    --ink: #111111;
    --ink-soft: #333333;
    --muted: #6f6f6f;
    --line: #111111;
    --line-soft: #e8e8e8;
    --danger: #8f1d1d;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    font-weight: 300; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    padding: calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  }
  .app { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .logo {
    width: 34px; height: 34px; flex: none; display: grid; place-items: center;
    border: 1px solid var(--line);
  }
  .logo svg { width: 18px; height: 18px; display: block; }
  h1 { font-size: 15px; margin: 0; font-weight: 400; letter-spacing: .22em; text-transform: uppercase; }
  header p { margin: 4px 0 0; font-size: 11px; color: var(--muted); letter-spacing: .02em; }
  .card { border: 1px solid var(--line); padding: 24px; background: var(--paper); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .field { margin-bottom: 20px; }
  label {
    display: block; margin-bottom: 8px; font-size: 9.5px; font-weight: 400;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  }
  .input-wrap { position: relative; }
  input, select {
    width: 100%; padding: 6px 44px 8px 0; border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; background: transparent; color: var(--ink);
    font-family: inherit; font-size: 17px; font-weight: 300;
    outline: none; appearance: none; -webkit-appearance: none;
  }
  select { padding-right: 26px; cursor: pointer; }
  input:focus, select:focus { box-shadow: 0 1px 0 0 var(--ink); }
  .unit {
    position: absolute; right: 0; bottom: 10px; font-size: 9.5px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); pointer-events: none;
  }
  .chev {
    position: absolute; right: 1px; bottom: 11px; font-size: 8px; color: var(--ink);
    pointer-events: none; transform: scaleY(.8);
  }
  button {
    width: 100%; margin-top: 2px; padding: 15px; border: 1px solid var(--line);
    border-radius: 0; background: var(--paper); color: var(--ink);
    font-family: inherit; font-size: 10px; font-weight: 400; letter-spacing: .2em;
    text-transform: uppercase; cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .15s, color .15s;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  button:disabled { color: var(--muted); border-color: var(--line-soft); }
  .result {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
  }
  .result .label { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .result .cost {
    font-size: 54px; font-weight: 200; letter-spacing: -.02em; line-height: 1.05;
    margin: 8px 0 6px; font-variant-numeric: tabular-nums;
  }
  .result .sub { font-size: 12px; color: var(--ink-soft); }
  .result .sub b { font-weight: 400; color: var(--ink); }
  .badge {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 12px;
    font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
  }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }
  .badge.warn { color: var(--ink); }
  .badge.warn .dot { background: var(--danger); }
  .error {
    margin-top: 18px; padding: 12px 14px; font-size: 12.5px; color: var(--danger);
    border: 1px solid var(--line-soft);
  }
  .status {
    margin: 14px 2px 0; font-size: 10px; line-height: 1.6; color: var(--muted);
    letter-spacing: .02em;
  }
  .status.warn { color: var(--danger); }
  footer {
    margin-top: 20px; text-align: center; font-size: 10px; line-height: 1.8;
    color: var(--muted); letter-spacing: .03em;
  }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line-soft); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 20 20" fill="none" stroke="#111111" stroke-width="1.2">
        <path d="M2 15 L6.5 9.5 L10 12 L14 5.5 L18 3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="2" cy="15" r="1.1" fill="#111111" stroke="none"/>
        <circle cx="18" cy="3.5" r="1.1" fill="#111111" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>GasTrack</h1>
      <p>Coût du trajet au prix réel du carburant</p>
    </div>
  </header>

  <form class="card" id="form" novalidate>
    <div class="row">
      <div class="field">
        <label for="consumption">Consommation</label>
        <div class="input-wrap">
          <input id="consumption" type="number" inputmode="decimal" step="0.1" min="0.1" max="100" value="6.5" required>
          <span class="unit">L/100km</span>
        </div>
      </div>
      <div class="field">
        <label for="distance">Distance</label>
        <div class="input-wrap">
          <input id="distance" type="number" inputmode="numeric" step="1" min="0" max="20000" value="50" required>
          <span class="unit">km</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label for="fuel">Carburant</label>
      <div class="input-wrap">
        <select id="fuel">
          <option value="Gazole" selected>Gazole (diesel)</option>
          <option value="SP95">SP95</option>
          <option value="SP98">SP98</option>
          <option value="E10">E10 (SP95-E10)</option>
          <option value="E85">E85 (bioéthanol)</option>
        </select>
        <span class="chev">▾</span>
      </div>
    </div>

    <button type="submit" id="submit">Calculer</button>

    <div class="result hidden" id="result" aria-live="polite">
      <div class="label">Coût estimé</div>
      <div class="cost" id="cost">—</div>
      <div class="sub" id="detail"></div>
      <div class="badge" id="badge"><span class="dot"></span><span id="badge-text"></span></div>
    </div>

    <div class="error hidden" id="error" role="alert"></div>
  </form>

  <p class="status" id="status" aria-live="polite">Initialisation…</p>

  <footer>
    Prix moyens nationaux — données officielles
    <a href="https://www.prix-carburants.gouv.fr" target="_blank" rel="noopener">prix-carburants.gouv.fr</a><br>
    Calcul effectué sur votre appareil · aucune donnée envoyée
  </footer>
</div>

      var raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !data.avg || !data.t) return null;
      if (Date.now() - data.t > CACHE_TTL) return null;
      return data;
    } catch (err) {
      return null;   // Safari privé : localStorage indisponible
    }
  }

  function writeCache(payload) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify(payload));
    } catch (err) {
      /* quota ou navigation privée : on continue sans cache */
    }
  }

  function ensureFflate() {
    return new Promise(function (resolve, reject) {
      if (typeof window.fflate !== 'undefined') return resolve();
      var started = Date.now();
      var timer = setInterval(function () {
        if (typeof window.fflate !== 'undefined') {
          clearInterval(timer);
          resolve();
        } else if (Date.now() - started > FFLATE_TIMEOUT) {
          clearInterval(timer);
          reject(new Error('Bibliothèque de décompression indisponible.'));
        }
      }, 100);
    });
  }

  /* --------------------------- récupération des prix ----------------------- */

  async function fetchPrices() {
    await ensureFflate();

    // Le CDN officiel renvoie l'en-tête CORS sur les réponses fraîches, mais pas
    // sur sa version en cache (constaté : GET nu = pas de CORS, GET avec
    // paramètre = CORS présent). D'où ce cache-buster, indispensable pour que
    // Safari autorise la lecture du ZIP.
    var url = PRICE_URL + '?t=' + Date.now();
    var response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);

    var buffer = new Uint8Array(await response.arrayBuffer());
    var files = window.fflate.unzipSync(buffer);
    var xmlName = Object.keys(files).filter(function (name) {
      return /\.xml$/i.test(name);
    })[0];
    if (!xmlName) throw new Error('Fichier XML absent de l’archive');

    // Le XML est déclaré en ISO-8859-1 : on décode explicitement les octets.
    var xmlText = new TextDecoder('iso-8859-1').decode(files[xmlName]);
    var doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('XML illisible');

    var nodes = doc.getElementsByTagName('prix');
    var sums = {};
    var counts = {};

    for (var i = 0; i < nodes.length; i++) {
      var fuel = nodes[i].getAttribute('nom');
      if (FUELS.indexOf(fuel) === -1) continue;
      var value = parseFloat((nodes[i].getAttribute('valeur') || '').replace(',', '.'));
      if (!isFinite(value) || value <= 0) continue;   // 0.000 = prix absent
      sums[fuel] = (sums[fuel] || 0) + value;
      counts[fuel] = (counts[fuel] || 0) + 1;
    }

    var avg = {};
    var count = {};
    FUELS.forEach(function (fuel) {
      if (counts[fuel]) {
        avg[fuel] = Math.round((sums[fuel] / counts[fuel]) * 1000) / 1000;
        count[fuel] = counts[fuel];
      }
    });
    if (!Object.keys(avg).length) throw new Error('Aucun prix exploitable');

    var payload = { t: Date.now(), avg: avg, count: count };
    writeCache(payload);
    return { avg: avg, count: count, t: payload.t, source: 'live' };
  }

  async function getPrices() {
    if (prices) return prices;

    var cached = readCache();
    if (cached) {
      prices = { avg: cached.avg, count: cached.count || {}, t: cached.t, source: 'cache' };
      renderStatus();
      return prices;
    }

    if (!inflight) {
      setStatus('Téléchargement des prix officiels…');
      inflight = (async function () {
        try {
          var data = await fetchPrices();
          prices = data;
          renderStatus();
          return data;
        } finally {
          inflight = null;
        }
      })();
    }
    return inflight;
  }

  function renderStatus() {
    if (!prices) return;
    var label = prices.source === 'cache' ? 'Prix en cache' : 'Prix officiels';
    var stations = prices.count && prices.count.Gazole ? num.format(prices.count.Gazole) + ' stations · ' : '';
    setStatus(label + ' · ' + stations + 'mis à jour à ' + clock.format(new Date(prices.t)));
  }

  /* -------------------------------- calcul -------------------------------- */

  form.addEventListener('submit', async function (event) {
    event.preventDefault();
    hideError();

    var consumption = parseFloat(String(document.getElementById('consumption').value).replace(',', '.'));
    var distance = parseFloat(String(document.getElementById('distance').value).replace(',', '.'));
    var fuel = document.getElementById('fuel').value;

    if (!isFinite(consumption) || consumption <= 0) {
      showError('Renseigne une consommation valide (supérieure à 0).');
      return;
    }
    if (!isFinite(distance) || distance < 0) {
      showError('Renseigne une distance valide (0 ou plus).');
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Calcul…';

    var info;
    try {
      info = await getPrices();
    } catch (err) {
      info = { avg: FALLBACK, count: {}, t: Date.now(), source: 'fallback' };
      setStatus('Prix estimés — téléchargement impossible.', true);
    }

    var unitPrice = info.avg[fuel] || FALLBACK[fuel];
    var liters = (distance / 100) * consumption;
    var cost = liters * unitPrice;

    costEl.textContent = euro.format(cost);
    detailEl.innerHTML = '<b>' + cents.format(unitPrice) + ' €/L</b> · ' +
      num.format(liters) + ' L consommés';

    badgeEl.classList.remove('warn');
    if (info.source === 'fallback') {
      badgeEl.classList.add('warn');
      badgeText.textContent = 'Prix par défaut — réseau indisponible';
    } else {
      var stations = info.count && info.count[fuel] ? num.format(info.count[fuel]) + ' stations · ' : '';
      badgeText.textContent = 'Moyenne nationale · ' + stations +
        'maj ' + clock.format(new Date(info.t));
    }

    resultEl.classList.remove('hidden');
    submit.disabled = false;
    submit.textContent = 'Calculer';
  });

  /* ------------------------------ démarrage ------------------------------- */

  if (readCache()) {
    getPrices();   // instantané
  } else {
    getPrices().catch(function () {
      setStatus('Prix estimés — téléchargement impossible.', true);
    });
  }
})();
</script>
